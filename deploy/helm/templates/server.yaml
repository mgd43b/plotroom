apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "plotroom.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "plotroom.labels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "plotroom.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "plotroom.podSecurity" . | nindent 8 }}
      containers:
        - name: plotroom
          image: {{ include "plotroom.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/plotroom/plotroom.toml"]
          securityContext:
            {{- include "plotroom.containerSecurity" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8765
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: "localhost:8765"
          volumeMounts:
            {{- include "plotroom.mounts" . | nindent 12 }}
      volumes:
        {{- include "plotroom.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "plotroom.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "plotroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8765
      targetPort: http
