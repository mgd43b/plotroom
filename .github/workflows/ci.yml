name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run pyright --pythonversion ${{ matrix.python }}
      - name: Core dependency check
        run: uv run python tests/depcheck.py
      - name: Tests
        run: uv run pytest

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build local container image
        run: docker build --tag plotroom:ci .
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.8"
      - name: Verify the Compose bridge and scripted relay
        run: uv run --locked python deploy/bridge_smoke.py --image-tag ci --project "plotroom-bridge-$GITHUB_RUN_ID"

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.8"
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          kubectl_version: v1.37.0
          install_only: true
      - name: Lint, render, and verify the chart on kind
        run: |
          set -eu
          cfg=$(mktemp -d)
          export KUBECONFIG="$cfg/config"
          cluster="plotroom-ci-$GITHUB_RUN_ID"
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ -s "$KUBECONFIG" ]; then
              kube() { kubectl --kubeconfig "$KUBECONFIG" --context "kind-$cluster" "$@"; }
              kube get pods,pvc -A -o wide || true
              kube get pv,storageclass || true
              kube get events -A --sort-by=.lastTimestamp || true
              for deployment in "plotroom-ci plotroom" "backup-ci backups" "bridge-ci bridge"; do
                read -r namespace release <<< "$deployment"
                for container in wait-for-data-owner plotroom; do
                  kube --namespace "$namespace" logs "deployment/$release" \
                    --container "$container" --tail=40 || true
                  kube --namespace "$namespace" logs "deployment/$release" \
                    --container "$container" --previous --tail=40 || true
                done
              done
            fi
            kind delete cluster --name "$cluster" --kubeconfig "$KUBECONFIG" || true
            rm -f -- "$KUBECONFIG" "$cfg/rendered.yaml"
            rmdir "$cfg" || true
            exit "$status"
          }
          trap cleanup EXIT
          helm lint deploy/helm --set tokenJob.enabled=true
          helm template plotroom deploy/helm --set tokenJob.enabled=true > "$cfg/rendered.yaml"
          docker build --tag plotroom:helm-ci .
          kind create cluster --name "$cluster" --kubeconfig "$KUBECONFIG" --wait 120s
          kind load docker-image plotroom:helm-ci --name "$cluster"
          python3 deploy/helm/smoke.py --kubeconfig "$KUBECONFIG" \
            --context "kind-$cluster" --namespace plotroom-ci --release plotroom --image-tag helm-ci
          python3 deploy/helm/backup_smoke.py --kubeconfig "$KUBECONFIG" \
            --context "kind-$cluster" --namespace backup-ci --release backups --image-tag helm-ci
          uv run --locked --no-dev python -m deploy.helm.bridge_smoke --kubeconfig "$KUBECONFIG" \
            --context "kind-$cluster" --namespace bridge-ci --release bridge --image-tag helm-ci
