name: GitHub fixture branch update

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Read-only preflight or separately approved fixture write observation
        type: choice
        default: preflight
        options: [preflight, acceptance]
      authorize_writes:
        description: Owner approves one fixture branch, PR, update attempt, and verified cleanup
        type: boolean
        default: false
      expected_sha:
        description: Reviewed Plotroom main commit (full SHA)
        type: string
        required: true
      fixture_ancestor:
        description: Reviewed fixture ancestor commit (full SHA)
        type: string
        required: true
      fixture_base:
        description: Reviewed fixture main commit (full SHA)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: github-fixture-acceptance
  cancel-in-progress: false

jobs:
  fixture:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.server_url == 'https://github.com' &&
      github.repository == 'mgd43b/plotroom' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mgd43b' &&
      github.triggering_actor == 'mgd43b' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.14"
      UV_PYTHON_PREFERENCE: only-managed
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      FIXTURE_ANCESTOR: ${{ inputs.fixture_ancestor }}
      FIXTURE_BASE: ${{ inputs.fixture_base }}
      FIXTURE_WRITES_AUTHORIZED: ${{ inputs.authorize_writes }}
      FIXTURE_PHASE: ${{ inputs.phase }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the reviewed source and phase
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          git diff --quiet HEAD --
          remote_main=$(git ls-remote --exit-code https://github.com/mgd43b/plotroom.git refs/heads/main)
          test "$remote_main" = "$EXPECTED_SHA"$'\trefs/heads/main'
          case "$FIXTURE_PHASE:$FIXTURE_WRITES_AUTHORIZED" in
            preflight:false|acceptance:true) ;;
            *) exit 1 ;;
          esac
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          require-checksums: true
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --no-dev
      - name: Read-only preflight
        if: inputs.phase == 'preflight'
        shell: bash
        run: |
          uv run --locked --offline --no-dev python scripts/github_fixture_branch_update.py preflight \
            --directory "$RUNNER_TEMP" --source "$EXPECTED_SHA" \
            --ancestor "$FIXTURE_ANCESTOR" --base "$FIXTURE_BASE"
      - name: Submit once and observe in a fresh process
        if: inputs.phase == 'acceptance' && inputs.authorize_writes
        shell: bash
        env:
          FIXTURE_PAT: ${{ secrets.PLOTROOM_GITHUB_FIXTURE_GITHUB_TOKEN }}
        run: |
          test -n "$FIXTURE_PAT"
          umask 077
          directory=$(mktemp -d "$RUNNER_TEMP/plotroom-fixture-67.XXXXXX")
          trap 'rm -rf -- "$directory"' EXIT
          printf '%s\n' "$FIXTURE_PAT" > "$directory/github-token"
          unset FIXTURE_PAT PLOTROOM_GITHUB_FIXTURE_GITHUB_TOKEN
          for phase in submit observe; do
            uv run --locked --offline --no-dev python scripts/github_fixture_branch_update.py "$phase" \
              --directory "$directory" --source "$EXPECTED_SHA" \
              --ancestor "$FIXTURE_ANCESTOR" --base "$FIXTURE_BASE"
          done
