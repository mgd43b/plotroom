[project]
name = "plotroom"
version = "0.0.0"
description = "Orchestration control plane for multi-session coding work"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
  "mcp>=2.3.0,<3",
  "uvicorn==0.54.0",
  "SQLAlchemy[asyncio]==2.1.9",
  "aiosqlite==0.22.1",
  "alembic==1.20.1",
  "httpx==0.28.1",
  "pyyaml>=6.0.2,<7",
  "sqlite-vec==0.1.9",
]

[project.scripts]
plotroom = "plotroom.app.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "pyright", "cryptography"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plotroom"]

[tool.uv]
python-preference = "only-managed"
required-version = ">=0.13.8"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "RUF012", "E501"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/migrations/versions"]
extraPaths = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
