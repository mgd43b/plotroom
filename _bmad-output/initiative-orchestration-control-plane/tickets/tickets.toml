# Epics of the orchestration control plane initiative, in build order.

[[epic]]
id = 1
slug = "epic-server-and-ledger"
title = "Server and ledger"
description = "One plotroom daemon per data directory serves the ledger over a stdio proxy and stateless HTTP with per-project role tokens; the event log, unit of work, action runner, ticks and a local-path ticket-tree mirror are in place; an orchestrator starts lanes for configured workers, rebuilds from snapshot() and next(), acks items and wakes through plotroom watch; it ships as a package, an image and a compose file."
covers = ["R1", "R2", "R3", "R4", "R8", "R9", "R22", "R24", "R27"]

[[epic]]
id = 2
slug = "epic-one-inbox"
title = "One inbox"
description = "GitHub (PRs, checks on main including image builds, review threads, issues and comments), the Codex switchboard (directly or through plotroom bridge), Claude session reports and deploy status arrive as typed, deduplicated events in one inbox, GitHub state is kept in one projection, the ticket tree is mirrored from the default branch, and the switchboard is acknowledged upstream once each event commits."
covers = ["R7", "R9", "R24", "R26"]
after = [{ epic = 1, needs = "the event log, unit of work and MCP tool surface" }]

[[epic]]
id = 3
slug = "epic-triggers"
title = "Triggers"
description = "The orchestrator registers 'when X, then Y' triggers bound to exact identities; they fire exactly once per transition on inbox events, lane run reports and ticks; their sends reach Codex workers through the switchboard or bridge and Claude lanes through the drained outbox."
covers = ["R5", "R6"]
after = [{ epic = 1, needs = "the drain role and config, the actions table and the action runner" }, { epic = 2, needs = "github and switchboard events and the GitHub projection" }]

[[epic]]
id = 4
slug = "epic-merge-controller"
title = "Merge controller"
description = "Every PR is judged by one gate over the GitHub projection, with freezes, flake candidates, automatic branch updates and a logged verdict per head SHA, and a MERGE verdict is executed by the orchestrator or clerk."
covers = ["R10", "R11", "R12", "R25"]
after = [{ epic = 1, needs = "the action runner, workers and lanes, and wait()" }, { epic = 2, needs = "the GitHub projection" }]

[[epic]]
id = 5
slug = "epic-claims-and-overlaps"
title = "Claims and overlaps"
description = "Lanes claim paths, every PR diff and ticket-tree move is checked against other lanes' claims and open PRs, and each overlap reaches next() before review."
covers = ["R13", "R14"]
after = [{ epic = 1, needs = "workers and lanes" }, { epic = 2, needs = "changed files in the GitHub projection and the default-branch tree mirror" }]

[[epic]]
id = 6
slug = "epic-briefs-and-checklists"
title = "Briefs and checklists"
description = "brief() fills a lane's brief with scope, claims to avoid and standing rules, and a READY lane's post-merge checklist becomes its active state until empty, when a checklist_empty trigger proposes the archive."
covers = ["R15", "R16"]
after = [{ epic = 5, needs = "current claims for the don't-touch section" }, { epic = 3, needs = "the trigger engine and the propose_archive action" }]

[[epic]]
id = 7
slug = "epic-human-queue"
title = "The human's queue"
description = "Decisions are recorded in the human's exact words, asks on GitHub are flagged when buried, stale or unanswered, and goal() reports what is left and why."
covers = ["R17", "R18", "R19"]
after = [{ epic = 1, needs = "the writer-rule table and ticks" }, { epic = 2, needs = "issues and comments in the GitHub projection" }]

[[epic]]
id = 8
slug = "epic-guardrails"
title = "Guardrails"
description = "A usage adapter reads provider spend; paid runs carry hard caps that raise next() items at 50% and 80% and stop the lane at 100%; and hands-on requests are routed to their owning lane."
covers = ["R7", "R20", "R21"]
after = [{ epic = 3, needs = "the trigger engine and send to workers" }]

[[epic]]
id = 9
slug = "epic-clerk-migration"
title = "Clerk migration"
description = "The clerk's markdown ledger and triggers are imported through the server's commands, and the clerk runs its merge sweep and triggers on plotroom's MCP calls with no cutover day."
covers = ["R23"]
after = [{ epic = 3, needs = "trigger records and fired state" }, { epic = 4, needs = "MERGE next items and merge_gate for the clerk's sweep" }]

[[epic]]
id = 10
slug = "epic-search"
title = "Search"
description = "The orchestrator finds past events, decisions, asks, lane reports and flakes by full text everywhere and by meaning where an embedder is deployed, within one project, including records written before search landed."
covers = ["R28"]
after = [{ epic = 2, needs = "inbox events and lane reports" }, { epic = 4, needs = "flake records" }, { epic = 7, needs = "decisions and asks" }]

[[epic]]
id = 11
slug = "epic-helm-chart"
title = "Helm chart"
description = "A Helm chart deploys plotroom on Kubernetes as one replica with the Recreate strategy and a block volume, and the same Claude Code and Codex clients that use a local instance work against it, Codex through the bridge."
covers = ["R24"]
after = [{ epic = 1, needs = "the container image and health endpoints" }, { epic = 2, needs = "plotroom bridge for Codex workers" }]
